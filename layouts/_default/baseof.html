<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | Vent Viper{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <link rel="stylesheet" href="/css/style.css">
  {{ block "head" . }}{{ end }}
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="/" class="logo"><img src="/images/logo.png" alt="Vent Viper LLC"> Vent Viper</a>
      <nav>
        {{ range .Site.Menus.main }}
        <a href="{{ .URL }}" {{ if $.IsMenuCurrent "main" . }}class="active"{{ end }}>{{ .Name }}</a>
        {{ end }}
      </nav>
    </div>
  </header>

  <main>
    {{ block "main" . }}{{ end }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-cta">
        <p>Ready to get started? Call or text Danny today.</p>
        <div class="footer-actions">
          <a href="tel:2019888307" class="btn">📞 (201) 988-8307</a>
          <a href="mailto:theventviperllc@hotmail.com" class="btn btn-outline">✉️ Email</a>
        </div>
      </div>
      <p class="footer-copy">&copy; {{ now.Year }} Vent Viper LLC &middot; Wyckoff, NJ</p>
    </div>
  </footer>
</body>
</html>
