<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | Vent Viper{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | Vent Viper{{ end }}">
  <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta property="og:image" content="https://ventviperenterprises.com/images/og-image.png">
  <meta property="og:url" content="https://ventviperenterprises.com{{ .RelPermalink }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://ventviperenterprises.com/images/og-image.png">
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
  {{ block "head" . }}{{ end }}
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="{{ "/" | relURL }}" class="logo"><img src="{{ "images/logo.png" | relURL }}" alt="Vent Viper LLC"> Vent Viper</a>
      <nav>
        {{ range .Site.Menus.main }}
        <a href="{{ .URL | relURL }}" {{ if $.IsMenuCurrent "main" . }}class="active"{{ end }}>{{ .Name }}</a>
        {{ end }}
      </nav>
    </div>
  </header>

  <main>
    {{ block "main" . }}{{ end }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-cta">
        <p>Ready to get started? Call or text Danny today.</p>
        <div class="footer-actions">
          <a href="tel:2019888307" class="btn">📞 (201) 988-8307</a>
          <a href="mailto:ventviperenterprises@outlook.com" class="btn btn-outline">✉️ Email</a>
        </div>
      </div>
      <p class="footer-copy">&copy; {{ now.Year }} Vent Viper LLC &middot; Wyckoff, NJ</p>
    </div>
  </footer>
</body>
</html>
